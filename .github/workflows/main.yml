name: Instagram Downloader & Processor

on:
  workflow_dispatch:
    inputs:
      insta_url:
        description: 'Instagram Reel/Video URL paste karein'
        required: true
        type: string

jobs:
  scrape-and-download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install chromium

      - name: Run Smart Auto-Fallback Scraper
        env:
          # GitHub action ka input python script me bhej rahe hain
          INSTAGRAM_URL: ${{ github.event.inputs.insta_url }} 
        run: python scraper.py

      # (Optional) Video ko GitHub Actions me save karne ke liye taaki aap use dekh sakein
      - name: Upload Downloaded Video as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Facebook-Ready-Video
          path: facebook_ready.mp4
          retention-days: 1 # 1 din baad auto-delete ho jayega taaki storage full na ho

      # (Optional) Webhook Trigger (Agar aap Make.com ya n8n use kar rahe hain)
      # - name: Send to Webhook
      #   run: |
      #     curl -X POST "YOUR_MAKE_COM_WEBHOOK_URL" -F "video=@facebook_ready.mp4"
