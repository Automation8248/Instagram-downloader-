name: Instagram Video Downloader

# Yeh trigger aapko GitHub par ek "Run workflow" button dega
on:
  workflow_dispatch:
    inputs:
      ig_url:
        description: 'Instagram Reel/Post URL paste karein'
        required: true
        # Default value aapka diya hua link set kiya hai
        default: 'https://www.instagram.com/p/DehahPxS57W/?dlrf=M2ZnZ2xreDZjNzFu'

jobs:
  download-video:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: 📦 Install Requirements
        run: pip install requests
          
      - name: 🚀 Run Python Downloader Script
        env:
          # Workflow input ko Python script tak bhej raha hai
          IG_URL: ${{ github.event.inputs.ig_url }}
        run: python downloader.py
        
      - name: 💾 Upload Video Artifact (For Download)
        uses: actions/upload-artifact@v4
        with:
          name: instagram-video-${{ github.run_id }}
          # Python script jo naam GITHUB_ENV me set karegi, ye step wahi file uthayega
          path: ${{ env.VIDEO_FILENAME }}
          retention-days: 1
